<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ランダム1コマ</title>
<style>
  html,body{margin:0;height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{
    position:relative;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;overflow:hidden;
  }
  #panel{
    max-width:100%;max-height:100%;object-fit:contain;
    transition:opacity .18s ease,transform .18s ease;
  }
  #stage.swap #panel{opacity:0;transform:scale(.98)}
  #redraw{
    position:absolute;right:12px;bottom:12px;
    border:none;border-radius:999px;padding:9px 16px;
    font-size:13px;font-weight:700;font-family:inherit;
    background:rgba(0,0,0,.74);color:#fff;cursor:pointer;
  }
  #redraw:hover{background:#000}
  #msg{position:absolute;font-size:13px;color:#9a9a9a}
</style>
</head>
<body>
<div id="stage" title="クリックで引き直し">
  <img id="panel" alt="漫画の1コマ" draggable="false">
  <button id="redraw" type="button">引き直す</button>
  <div id="msg">読み込み中…</div>
</div>
<script>
(function(){
  /* 画像配信元(jsDelivr / GitHub: satsumaimo92/nice-panels)。
     コマを増やしても変更不要。リポジトリ名を変える場合のみ差し替える。 */
  var BASE = "https://cdn.jsdelivr.net/gh/satsumaimo92/nice-panels@main/";

  var stage=document.getElementById("stage"),
      img=document.getElementById("panel"),
      btn=document.getElementById("redraw"),
      msg=document.getElementById("msg"),
      panels=[],last=-1,nextSrc=null;

  function pick(){
    var i=Math.floor(Math.random()*panels.length);
    if(panels.length>1&&i===last)i=(i+1)%panels.length;
    last=i;
    return BASE+panels[i];
  }
  function preload(){nextSrc=pick();var p=new Image();p.src=nextSrc;}
  function draw(){
    if(!panels.length)return;
    var src=nextSrc||pick();
    stage.classList.add("swap");
    setTimeout(function(){
      img.src=src;
      requestAnimationFrame(function(){stage.classList.remove("swap");});
      preload();
    },180);
  }

  stage.addEventListener("click",draw);
  btn.addEventListener("click",function(e){e.stopPropagation();draw();});

  fetch(BASE+"manifest.json",{cache:"no-cache"})
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(m){
      panels=m.panels||[];
      if(!panels.length)throw 0;
      msg.style.display="none";
      nextSrc=pick();
      img.src=nextSrc;
      img.onload=preload;
    })
    .catch(function(){msg.textContent="読み込めませんでした(BASE_URL を確認してください)";});
})();
</script>
</body>
</html>
