<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ランダム1コマ</title>
<style>
  html,body{margin:0;height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{
    position:relative;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;overflow:hidden;
  }
  #panel{
    max-width:100%;max-height:100%;object-fit:contain;
    transition:opacity .15s ease;
  }
  #panel.dim{opacity:.4}
  #msg{position:absolute;font-size:13px;color:#9a9a9a}
  #tag{
    position:absolute;left:10px;bottom:9px;
    font-size:10px;letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
    color:#1a1a1a;opacity:.3;
    pointer-events:none;user-select:none;
  }
</style>
</head>
<body>
<div id="stage" title="クリックで引き直し">
  <img id="panel" alt="" draggable="false">
  <div id="tag"></div>
  <div id="msg"></div>
</div>
<script>
(function(){
  /* 画像配信元(jsDelivr / GitHub: satsumaimo92/nice-panels)。
     コマを増やしても変更不要。リポジトリ名を変える場合のみ差し替える。 */
  var BASE = "https://cdn.jsdelivr.net/gh/satsumaimo92/nice-panels@main/";

  var stage=document.getElementById("stage"),
      img=document.getElementById("panel"),
      msg=document.getElementById("msg"),
      tag=document.getElementById("tag"),
      panels=[],last=-1,reqId=0;

  function pick(){
    var i=Math.floor(Math.random()*panels.length);
    if(panels.length>1&&i===last)i=(i+1)%panels.length;
    last=i;
    return BASE+panels[i];
  }
  function setTag(src){
    var m=src.match(/nice_(\d+)_(\d+)/);
    tag.textContent=m?(parseInt(m[1],10)+"-"+m[2]):"";
  }
  function show(src){
    img.src=src;
    setTag(src);
    requestAnimationFrame(function(){img.classList.remove("dim");});
  }
  function draw(){
    if(!panels.length)return;
    var src=pick();                // クリックのたびにその場で抽選
    var id=++reqId;                // 連打対策: 最新のクリックだけ反映
    img.classList.add("dim");      // 即座に薄く = 切り替え中の合図
    var im=new Image();
    im.onload=im.onerror=function(){ if(id===reqId)show(src); };
    im.src=src;
  }

  stage.addEventListener("click",draw);

  fetch(BASE+"manifest.json",{cache:"no-cache"})
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(m){
      panels=m.panels||[];
      if(!panels.length)throw 0;
      draw();
    })
    .catch(function(){msg.textContent="読み込めませんでした(BASE_URL を確認してください)";});
})();
</script>
</body>
</html>
